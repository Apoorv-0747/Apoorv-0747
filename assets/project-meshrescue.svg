<text x="40" y="84" class="tt">MeshRescue</text>
<text x="920" y="46" text-anchor="end" class="lk">View repository  →</text>
<text x="40" y="116" class="d">Infrastructure-free, self-healing IoT mesh network with Edge AI that detects survivors, routes</text><text x="40" y="140" class="d">around hazards using A* pathfinding, and automates emergency triage when cellular networks fail.</text><rect x="40" y="176" width="82.4" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="52" y="193.5" textLength="58.4" lengthAdjust="spacingAndGlyphs" class="ch">React 18</text><rect x="132.4" y="176" width="53.2" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="144.4" y="193.5" textLength="29.2" lengthAdjust="spacingAndGlyphs" class="ch">Vite</text><rect x="195.60000000000002" y="176" width="118.89999999999999" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="207.60000000000002" y="193.5" textLength="94.89999999999999" lengthAdjust="spacingAndGlyphs" class="ch">TensorFlow.js</text><rect x="324.5" y="176" width="67.8" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="336.5" y="193.5" textLength="43.8" lengthAdjust="spacingAndGlyphs" class="ch">YAMNet</text><rect x="402.3" y="176" width="75.1" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="414.3" y="193.5" textLength="51.1" lengthAdjust="spacingAndGlyphs" class="ch">Node.js</text><rect x="487.4" y="176" width="75.1" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="499.4" y="193.5" textLength="51.1" lengthAdjust="spacingAndGlyphs" class="ch">Express</text><rect x="572.5" y="176" width="97.0" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="584.5" y="193.5" textLength="73.0" lengthAdjust="spacingAndGlyphs" class="ch">WebSockets</text><rect x="679.5" y="176" width="111.6" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="691.5" y="193.5" textLength="87.6" lengthAdjust="spacingAndGlyphs" class="ch">HTML5 Canvas</text><rect x="801.1" y="176" width="75.1" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="813.1" y="193.5" textLength="51.1" lengthAdjust="spacingAndGlyphs" class="ch">Leaflet</text><rect x="40" y="212" width="148.1" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="52" y="229.5" textLength="124.1" lengthAdjust="spacingAndGlyphs" class="ch">Gemini Multimodal</text><rect x="198.1" y="212" width="126.2" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="210.1" y="229.5" textLength="102.2" lengthAdjust="spacingAndGlyphs" class="ch">A* Pathfinding</text><rect x="334.29999999999995" y="212" width="118.89999999999999" height="26" rx="13" fill="#0f2a3d" stroke="#1d5a78"/><text x="346.29999999999995" y="229.5" textLength="94.89999999999999" lengthAdjust="spacingAndGlyphs" class="ch">Framer Motion</text>
